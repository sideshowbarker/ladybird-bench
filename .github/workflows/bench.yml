name: Benchmark a Ladybird branch

run-name: "${{ inputs.mode }}: ${{ inputs.ladybird_ref || 'master' }} on ${{ inputs.runner }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'calibrate (A-vs-A of one commit) or compare (branch vs its merge-base with master)'
        type: choice
        options: [calibrate, compare]
        default: calibrate
      ladybird_repo:
        description: 'Repository the ref is fetched from'
        default: 'sideshowbarker/ladybird'
      ladybird_ref:
        description: 'Branch or commit to measure (empty: upstream master)'
        default: ''
      runner:
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-15]
        default: ubuntu-24.04
      rounds:
        description: 'Kept rounds per arm (even)'
        default: '8'
      benchmarks:
        description: 'Comma-separated suites (empty: all)'
        default: ''
      exclude:
        description: 'Suites left out when benchmarks is empty (WebKitCSS/WhereIsClassRuleIndexing hangs on master, 2026-11)'
        default: 'WebKitCSS'
      focus:
        description: 'Space-separated suites or Benchmark/test keys judged as their own family'
        default: ''
      benchmarks_repo:
        default: 'LadybirdBrowser/web-benchmarks'
      benchmarks_ref:
        default: 'master'

permissions:
  contents: read

env:
  WORK: ${{ github.workspace }}/work
  MODE: ${{ inputs.mode }}
  LADYBIRD_REPO: ${{ inputs.ladybird_repo }}
  LADYBIRD_REF: ${{ inputs.ladybird_ref }}
  BENCHMARKS_REPO: ${{ inputs.benchmarks_repo }}
  BENCHMARKS_REF: ${{ inputs.benchmarks_ref }}
  ROUNDS: ${{ inputs.rounds }}
  BENCHMARKS: ${{ inputs.benchmarks }}
  EXCLUDE: ${{ inputs.exclude }}
  FOCUS: ${{ inputs.focus }}
  RUNNER_LABEL: ${{ inputs.runner }}

jobs:
  linux:
    if: startsWith(inputs.runner, 'ubuntu')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: harness

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Describe the machine
        id: machine
        run: bash harness/ci/describe-machine.sh

      - name: Check out Ladybird and the benchmarks
        id: revisions
        run: bash harness/ci/checkout.sh

      - name: Pull the CI image
        run: docker pull --quiet "${{ steps.revisions.outputs.image }}"

      # -march=native is the default compile flag outside CI's baseline-CPU builds, so compiler caches are only shared
      # between runners with the same CPU model.
      - name: Restore the compiler caches
        uses: actions/cache/restore@v6
        with:
          path: |
            work/cache/ccache
            work/cache/sccache
          key: compilers-${{ steps.machine.outputs.cpu_key }}-${{ github.run_id }}
          restore-keys: compilers-${{ steps.machine.outputs.cpu_key }}-

      - name: Restore the vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: work/cache/vcpkg/archives
          key: vcpkg-${{ inputs.runner }}-${{ steps.revisions.outputs.vcpkg_key }}
          restore-keys: vcpkg-${{ inputs.runner }}-

      - name: Restore the calibration record
        if: inputs.mode == 'compare'
        uses: actions/cache/restore@v6
        with:
          path: work/cache/ladybird-bench/noise-floor.json
          key: noise-floor-${{ inputs.runner }}-${{ github.run_id }}
          restore-keys: noise-floor-${{ inputs.runner }}-

      - name: Build both arms
        id: build
        timeout-minutes: 240
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          docker run --rm --init --shm-size=4g -v "$WORK:/work" -v "$GITHUB_WORKSPACE/harness/ci:/ci:ro" \
              -e MODE -e HEAD_SHA -e BASE_SHA -e ROUNDS -e BENCHMARKS -e EXCLUDE -e FOCUS \
              "${{ steps.revisions.outputs.image }}" bash /ci/phase.sh build

      # The container runs as root; let the runner user read what it wrote, for the cache saves and the upload.
      - name: Make the container's files readable
        if: always() && steps.build.outcome != 'skipped'
        run: sudo chmod -R a+rX "$WORK/cache" "$WORK/out" 2>/dev/null || true

      # Saved even when the build failed or timed out, so the next run starts warm.
      - name: Save the compiler caches
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            work/cache/ccache
            work/cache/sccache
          key: compilers-${{ steps.machine.outputs.cpu_key }}-${{ github.run_id }}

      - name: Save the vcpkg packages
        if: always() && steps.build.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: work/cache/vcpkg/archives
          key: vcpkg-${{ inputs.runner }}-${{ steps.revisions.outputs.vcpkg_key }}

      - name: Measure
        timeout-minutes: 110
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          docker run --rm --init --shm-size=4g -v "$WORK:/work" -v "$GITHUB_WORKSPACE/harness/ci:/ci:ro" \
              -e MODE -e HEAD_SHA -e BASE_SHA -e ROUNDS -e BENCHMARKS -e EXCLUDE -e FOCUS \
              "${{ steps.revisions.outputs.image }}" bash /ci/phase.sh measure

      - name: Save the calibration record
        if: inputs.mode == 'calibrate' && success() && hashFiles('work/cache/ladybird-bench/noise-floor.json') != ''
        uses: actions/cache/save@v6
        with:
          path: work/cache/ladybird-bench/noise-floor.json
          key: noise-floor-${{ inputs.runner }}-${{ github.run_id }}

      - name: Summarize
        if: always()
        run: |
          sudo chmod -R a+rX "$WORK/out" "$WORK/cache/ladybird-bench" 2>/dev/null || true
          bash harness/ci/summarize.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ inputs.mode }}-${{ inputs.runner }}-${{ github.run_id }}
          path: |
            work/out/
            work/cache/ladybird-bench/*.log
            work/cache/ladybird-bench/*.json
            work/cache/ladybird-bench/*..*/
          if-no-files-found: warn
          retention-days: 90

  macos:
    if: startsWith(inputs.runner, 'macos')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: harness

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The image carries several Xcodes and the Android SDK; two LTO trees need the room more.
      - name: Free disk space and quiet the machine
        run: |
          selected=$(realpath "$(xcode-select -p)/../..")
          for xcode in /Applications/Xcode*.app; do
            [ "$(realpath "$xcode")" = "$selected" ] || sudo rm -rf "$xcode"
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet"
          sudo mdutil -a -i off > /dev/null || true
          xcodebuild -version
          df -h "$GITHUB_WORKSPACE"

      - name: Describe the machine
        id: machine
        run: bash harness/ci/describe-machine.sh

      - name: Check out Ladybird and the benchmarks
        id: revisions
        run: bash harness/ci/checkout.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          brew update --quiet
          brew unlink openssl@3 || true
          brew install --quiet autoconf autoconf-archive automake bash ccache coreutils libtool llvm@22 nasm ninja \
              pkg-config sccache unzip
          python3 -m pip install --quiet pyyaml requests six cryptography

          version=1.243.0
          name=wasm-tools-${version}-aarch64-macos
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$name.tar.gz" \
              "https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/${name}.tar.gz"
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      # Both arms' pinned toolchains, with the components each rust-toolchain.toml names.
      - name: Install the Rust toolchains
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            dir=$RUNNER_TEMP/rust-$sha
            mkdir -p "$dir"
            git -C "$WORK/src" show "$sha:rust-toolchain.toml" > "$dir/rust-toolchain.toml"
            (cd "$dir" && rustup toolchain install)
          done

      - name: Restore the compiler caches
        uses: actions/cache/restore@v6
        with:
          path: |
            work/cache/ccache
            work/cache/sccache
          key: compilers-${{ steps.machine.outputs.cpu_key }}-${{ github.run_id }}
          restore-keys: compilers-${{ steps.machine.outputs.cpu_key }}-

      - name: Restore the vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: work/cache/vcpkg/archives
          key: vcpkg-${{ inputs.runner }}-${{ steps.revisions.outputs.vcpkg_key }}
          restore-keys: vcpkg-${{ inputs.runner }}-

      - name: Restore the calibration record
        if: inputs.mode == 'compare'
        uses: actions/cache/restore@v6
        with:
          path: work/cache/ladybird-bench/noise-floor.json
          key: noise-floor-${{ inputs.runner }}-${{ github.run_id }}
          restore-keys: noise-floor-${{ inputs.runner }}-

      - name: Build both arms
        id: build
        timeout-minutes: 240
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          # Ladybird builds Rust with -Ctarget-cpu=native, which in a macOS VM names a CPU without the features the
          # ring crate asserts at compile time. RUSTFLAGS takes precedence over the per-target flags the build sets, so
          # this pins the same CPU CI's baseline-CPU builds use. -Dwarnings is the other per-target flag.
          RUSTFLAGS: -Dwarnings -Ctarget-cpu=apple-m1
        run: bash harness/ci/phase.sh build

      # Saved even when the build failed or timed out, so the next run starts warm.
      - name: Save the compiler caches
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            work/cache/ccache
            work/cache/sccache
          key: compilers-${{ steps.machine.outputs.cpu_key }}-${{ github.run_id }}

      - name: Save the vcpkg packages
        if: always() && steps.build.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: work/cache/vcpkg/archives
          key: vcpkg-${{ inputs.runner }}-${{ steps.revisions.outputs.vcpkg_key }}

      - name: Measure
        timeout-minutes: 110
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: bash harness/ci/phase.sh measure

      - name: Save the calibration record
        if: inputs.mode == 'calibrate' && success() && hashFiles('work/cache/ladybird-bench/noise-floor.json') != ''
        uses: actions/cache/save@v6
        with:
          path: work/cache/ladybird-bench/noise-floor.json
          key: noise-floor-${{ inputs.runner }}-${{ github.run_id }}

      - name: Summarize
        if: always()
        run: bash harness/ci/summarize.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ inputs.mode }}-${{ inputs.runner }}-${{ github.run_id }}
          path: |
            work/out/
            work/cache/ladybird-bench/*.log
            work/cache/ladybird-bench/*.json
            work/cache/ladybird-bench/*..*/
          if-no-files-found: warn
          retention-days: 90
