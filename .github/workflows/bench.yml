name: Benchmark a Ladybird branch

run-name: "${{ inputs.mode }}: ${{ inputs.ladybird_ref || 'master' }} on ${{ inputs.runner }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'calibrate (A-vs-A of one commit) or compare (branch vs its merge-base with master)'
        type: choice
        options: [calibrate, compare]
        default: calibrate
      ladybird_repo:
        description: 'Repository the ref is fetched from'
        default: 'sideshowbarker/ladybird'
      ladybird_ref:
        description: 'Branch or commit to measure (empty: upstream master)'
        default: ''
      runner:
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm]
        default: ubuntu-24.04
      rounds:
        description: 'Kept rounds per arm (even)'
        default: '8'
      benchmarks:
        description: 'Comma-separated suites (empty: all)'
        default: ''
      focus:
        description: 'Space-separated suites or Benchmark/test keys judged as their own family'
        default: ''
      benchmarks_repo:
        default: 'LadybirdBrowser/web-benchmarks'
      benchmarks_ref:
        default: 'master'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      WORK: ${{ github.workspace }}/work
      MODE: ${{ inputs.mode }}
      LADYBIRD_REPO: ${{ inputs.ladybird_repo }}
      LADYBIRD_REF: ${{ inputs.ladybird_ref }}
      ROUNDS: ${{ inputs.rounds }}
      BENCHMARKS: ${{ inputs.benchmarks }}
      FOCUS: ${{ inputs.focus }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: harness

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Describe the machine
        id: machine
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          echo "cpu_key=$(uname -m)-$(printf '%s' "$model" | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
          {
            echo "### Machine"
            echo
            echo "- Runner: ${{ inputs.runner }}"
            echo "- CPU: ${model}, $(nproc) vCPUs"
            echo "- Memory: $(free -g | awk '/^Mem:/ { print $2 }') GiB"
            echo "- Kernel: $(uname -r)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out Ladybird and the benchmarks
        id: revisions
        run: |
          mkdir -p "$WORK"
          git clone --quiet --filter=blob:none https://github.com/LadybirdBrowser/ladybird.git "$WORK/src"
          cd "$WORK/src"
          if [ -n "$LADYBIRD_REF" ]; then
            git fetch --quiet --filter=blob:none "https://github.com/${LADYBIRD_REPO}.git" "$LADYBIRD_REF"
            head=$(git rev-parse FETCH_HEAD)
          else
            head=$(git rev-parse origin/master)
          fi
          git checkout --quiet --detach "$head"
          if [ "$MODE" = calibrate ]; then
            base=$head
          else
            base=$(git merge-base "$head" origin/master)
            if [ "$base" = "$head" ]; then
              echo "::error::$head is already on master, so there's nothing to compare."
              exit 1
            fi
          fi
          image=$(git show "$head:.github/workflows/ci.yml" | grep -o 'ghcr.io/ladybirdbrowser/ladybird-ci:[0-9.]*' | head -1)
          [ -n "$image" ] || { echo "::error::No ladybird-ci image named in ci.yml at $head"; exit 1; }
          {
            echo "head=$head"
            echo "base=$base"
            echo "image=$image"
            echo "vcpkg_key=$(git show "$head:vcpkg.json" | sha256sum | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
          git clone --quiet "https://github.com/${{ inputs.benchmarks_repo }}.git" "$WORK/web-benchmarks"
          git -C "$WORK/web-benchmarks" checkout --quiet --detach "${{ inputs.benchmarks_ref }}"
          {
            echo "### Revisions"
            echo
            echo "- Head: ${head} (${LADYBIRD_REPO} ${LADYBIRD_REF:-master})"
            echo "- Base: ${base}"
            echo "- Benchmarks: $(git -C "$WORK/web-benchmarks" rev-parse --short HEAD)"
            echo "- Image: ${image}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull the CI image
        run: docker pull --quiet "${{ steps.revisions.outputs.image }}"

      # -march=native is the default compile flag outside CI's baseline-CPU builds, so compiler caches are only shared
      # between runners with the same CPU model.
      - name: Restore the compiler caches
        uses: actions/cache/restore@v6
        with:
          path: |
            work/cache/ccache
            work/cache/sccache
          key: compilers-${{ steps.machine.outputs.cpu_key }}-${{ github.run_id }}
          restore-keys: compilers-${{ steps.machine.outputs.cpu_key }}-

      - name: Restore the vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: work/cache/vcpkg/archives
          key: vcpkg-${{ inputs.runner }}-${{ steps.revisions.outputs.vcpkg_key }}
          restore-keys: vcpkg-${{ inputs.runner }}-

      - name: Restore the calibration record
        if: inputs.mode == 'compare'
        uses: actions/cache/restore@v6
        with:
          path: work/cache/ladybird-bench/noise-floor.json
          key: noise-floor-${{ inputs.runner }}-${{ github.run_id }}
          restore-keys: noise-floor-${{ inputs.runner }}-

      - name: Build both arms
        id: build
        timeout-minutes: 240
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          docker run --rm --init --shm-size=4g -v "$WORK:/work" -v "$GITHUB_WORKSPACE/harness/ci:/ci:ro" \
              -e MODE -e HEAD_SHA -e BASE_SHA -e ROUNDS -e BENCHMARKS -e FOCUS \
              "${{ steps.revisions.outputs.image }}" bash /ci/in-container.sh build

      # The container runs as root; let the runner user read what it wrote, for the cache saves and the upload.
      - name: Make the container's files readable
        if: always() && steps.build.outcome != 'skipped'
        run: sudo chmod -R a+rX "$WORK/cache" "$WORK/out" 2>/dev/null || true

      # Saved even when the build failed or timed out, so the next run starts warm.
      - name: Save the compiler caches
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            work/cache/ccache
            work/cache/sccache
          key: compilers-${{ steps.machine.outputs.cpu_key }}-${{ github.run_id }}

      - name: Save the vcpkg packages
        if: always() && steps.build.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: work/cache/vcpkg/archives
          key: vcpkg-${{ inputs.runner }}-${{ steps.revisions.outputs.vcpkg_key }}

      - name: Measure
        timeout-minutes: 110
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          docker run --rm --init --shm-size=4g -v "$WORK:/work" -v "$GITHUB_WORKSPACE/harness/ci:/ci:ro" \
              -e MODE -e HEAD_SHA -e BASE_SHA -e ROUNDS -e BENCHMARKS -e FOCUS \
              "${{ steps.revisions.outputs.image }}" bash /ci/in-container.sh measure

      - name: Save the calibration record
        if: inputs.mode == 'calibrate' && success() && hashFiles('work/cache/ladybird-bench/noise-floor.json') != ''
        uses: actions/cache/save@v6
        with:
          path: work/cache/ladybird-bench/noise-floor.json
          key: noise-floor-${{ inputs.runner }}-${{ github.run_id }}

      - name: Summarize
        if: always()
        run: |
          {
            if [ -f "$WORK/out/bench_pr.log" ]; then
              echo "### Result"
              echo
              echo '```'
              grep -E '^(A-vs-A calibration|false movers|  [^ ].*[+-][0-9.]+%$)|BLOCKING|warning:' "$WORK/out/bench_pr.log" || true
              echo '```'
              echo
            fi
            [ -f "$WORK/out/pr-perf-section.md" ] && cat "$WORK/out/pr-perf-section.md"
          } >> "$GITHUB_STEP_SUMMARY"
          sudo chmod -R a+rX "$WORK/out" "$WORK/cache/ladybird-bench" 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ inputs.mode }}-${{ inputs.runner }}-${{ github.run_id }}
          path: |
            work/out/
            work/cache/ladybird-bench/*.log
            work/cache/ladybird-bench/*.json
            work/cache/ladybird-bench/*..*/
          if-no-files-found: warn
          retention-days: 90
